services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # These override the localhost values in .env so the container uses the internal Docker network
      - VALKEY_URL=redis://valkey:6379
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - valkey
      - minio

  valkey:
    image: valkey/valkey:latest
    ports:
      - "6379:6379"

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data

volumes:
  minio_data: