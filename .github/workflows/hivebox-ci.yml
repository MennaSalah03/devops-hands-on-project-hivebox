name: hivebox-ci

on:
  push:
    branches:
     - main
     - feature/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref ||  github.ref }}
  cancel-in-progress: true

jobs:
  hivebox-build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      built: ${{ steps.build.outputs.built }}
      image_version: ${{ steps.build.outputs.image_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      # Linting 
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint < Dockerfile

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Lint Python source (ruff)
        run: uvx ruff check --output-format=github src/

      # Testing
      - name: Install dependencies
        run: uv sync --locked

      - name: Unit Testing
        run: uv run pytest tests/

      # Build docker image
      - name: building the docker image for hivebox
        id: build
        run: ./build.sh

        # pushing the image to registry + save and upload the version to use in CD
      - name: Log in to GHCR
        if: steps.build.outputs.built == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to registry after renaming it according to the standards.
        if: steps.build.outputs.built == 'true'
        run: |
          # change tag to suit the ghcr accepted format (owner name is in Lowercase (LC))
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag hivebox:${{ steps.build.outputs.image_version }} ghcr.io/${OWNER_LC}/hivebox:${{ steps.build.outputs.image_version }}
          docker push ghcr.io/${OWNER_LC}/hivebox:${{ steps.build.outputs.image_version }}

      - name: Save image version
        if: steps.build.outputs.built == 'true'
        run: echo "${{ steps.build.outputs.image_version }}" > image_version.txt

      - name: Upload version artifact
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 
        with:
          name: image-version
          path: image_version.txt
          
  # Setting up OSSF scoreboard
  ossf_scorecard:
    needs: hivebox-build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  semgrep_sast_scanner:
    needs: hivebox-build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Semgrep Python Security Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python
          generateSarif: "1"
      - name: Upload Semgrep results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'semgrep.sarif'

  terrascan_iac_scanner:
      needs: hivebox-build-and-test
      if: github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      permissions:
        contents: read
        security-events: write
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Run Terrascan
          uses: tenable/terrascan-action@v1
          with:
            iac_dir: '.'
            sarif_upload: true
            only_warn: true 

        - name: Upload Terrascan SARIF to GitHub Security Tab
          if: always()
          uses: github/codeql-action/upload-sarif@v3
          with:
            sarif_file: terrascan.sarif