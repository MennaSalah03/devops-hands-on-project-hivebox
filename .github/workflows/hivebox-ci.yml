name: hivebox-ci

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref ||  github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hivebox-build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      built: ${{ steps.build.outputs.built }}
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint < Dockerfile

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Lint Python source (ruff)
        run: uvx ruff check --output-format=github src/

      # Testing
      - name: Install dependencies
        run: uv sync --locked

      - name: Unit Testing
        env:
          VALKEY_URL: "redis://localhost:6379"
          MINIO_ENDPOINT: "localhost:9000"
          MINIO_ACCESS_KEY: "test-access"
          MINIO_SECRET_KEY: "test-secret"
        run: uv run pytest

      - name: Fetch app version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="sha-$(git rev-parse --short HEAD)"
          fi
          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        id: build
        run: |
          docker build \
            --build-arg APP_VERSION="${{ steps.version.outputs.app_version }}" \
            -t hivebox:${{ steps.version.outputs.app_version }} \
            .
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.build.outputs.built == 'true' && github.event_name == 'push'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to registry after renaming it according to the standards.
        if: steps.build.outputs.built == 'true' && github.event_name == 'push'
        run: |
          # change tag to suit the ghcr accepted format (owner name is in Lowercase (LC))
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag hivebox:${{ steps.build.outputs.app_version }} ghcr.io/${OWNER_LC}/hivebox:${{ steps.build.outputs.app_version }}
          docker push ghcr.io/${OWNER_LC}/hivebox:${{ steps.build.outputs.app_version }}

  # deploy:
  #   needs: hivebox-build-and-test
  #   if: github.event_name == 'push'
  #   uses: ./.github/workflows/hivebox-cd.yml
  #   with:
  #     image_version: ${{ needs.hivebox-build-and-test.outputs.app_version }}
  #   secrets: inherit
  
  ossf_scorecard:
    needs: hivebox-build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  semgrep_sast_scanner:
    needs: hivebox-build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Semgrep Python Security Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python
          generateSarif: "1"
      - name: Upload Semgrep results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'semgrep.sarif'

  terrascan_iac_scanner:
      needs: hivebox-build-and-test
      if: github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      permissions:
        contents: read
        security-events: write
      steps:
        - name: Checkout code
          uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
          
        - name: Install Terrascan CLI
          run: |
            curl -sL "https://github.com/tenable/terrascan/releases/download/v1.19.9/terrascan_1.19.9_Linux_x86_64.tar.gz" | tar -xz terrascan
            sudo mv terrascan /usr/local/bin/
            terrascan version

        - name: Run Terrascan
          id: scan
          continue-on-error: true
          run: |
            terrascan scan -i k8s -d ./k8s_manifests -o sarif > terrascan.sarif

        - name: Verify SARIF file integrity
          id: check_sarif
          if: always()
          run: |
            if [ -s terrascan.sarif ]; then
              echo "File exists and is not empty."
              echo "valid=true" >> $GITHUB_OUTPUT
            else
              echo "Terrascan crashed or failed to write the SARIF output."
              echo "valid=false" >> $GITHUB_OUTPUT
            fi

        - name: Upload Terrascan SARIF to GitHub Security Tab
          if: always() && steps.check_sarif.outputs.valid == 'true'
          uses: github/codeql-action/upload-sarif@v4
          with:
            sarif_file: terrascan.sarif
