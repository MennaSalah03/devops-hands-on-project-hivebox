name: hivebox-cd

on:
  workflow_run:
    workflows: 
      - "hivebox-ci"
    types:
      - completed
    branches: 
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hivebox-deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Set global lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Download version artifact
        uses: actions/download-artifact@v4
        with:
          name: image-version
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Export Image Version to Environment
        run: |
          echo "IMAGE_VERSION=$(cat version.txt)" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          config: k8s_manifests/kind.yaml

      - name: Load image into kind cluster
        run: |
          docker pull ghcr.io/${OWNER_LC}/hivebox:$IMAGE_VERSION
          kind load docker-image ghcr.io/${OWNER_LC}/hivebox:$IMAGE_VERSION

      - name: Apply k8s manifests
        run: |
          kubectl apply -f k8s_manifests/hivebox-configmap.yaml
          kubectl apply -f k8s_manifests/hivebox-deployment.yaml
          kubectl apply -f k8s_manifests/hivebox-service.yaml

      - name: Update image in running deployment
        run: |
          kubectl set image deployment/hivebox \
            hivebox=ghcr.io/${OWNER_LC}/hivebox:$IMAGE_VERSION

      - name: Verify rollout
        run: kubectl rollout status deployment/hivebox --timeout=120s

      - name: Promote image to latest
        run: |
          docker tag ghcr.io/${OWNER_LC}/hivebox:$IMAGE_VERSION ghcr.io/${OWNER_LC}/hivebox:latest
          docker push ghcr.io/${OWNER_LC}/hivebox:latest